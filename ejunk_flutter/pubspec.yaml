name: ejunk_flutter
description: "Electronic Junk Recipe Book - AI-powered component dismantling guide"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  image_picker: ^1.0.7
  flutter_vision: ^1.1.2
  get: ^4.6.6
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  camera: ^0.10.5+9
  provider: ^6.1.1
  google_generative_ai: ^0.4.6
  image: ^4.1.3
  flutter_svg: ^2.2.4
  flutter_svg: ^2.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/models/
